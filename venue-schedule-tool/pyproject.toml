[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "venue-schedule-tool"
version = "0.1.0"
description = "场馆档期冲突提示与交接齐套检查（实验室系统，只提示不锁档）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
